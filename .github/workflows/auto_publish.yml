name: Wild Vault - Wildlife Video Generator & Publisher

on:
  schedule:
    # 6 publicaciones automáticas al día (Horarios de mayor engagement)
    - cron: '0 9 * * *'   # 4:00 AM COT / 11:00 AM CET
    - cron: '0 11 * * *'  # 6:00 AM COT / 1:00 PM CET
    - cron: '0 13 * * *'  # 8:00 AM COT / 3:00 PM CET
    - cron: '0 17 * * *'  # 12:00 PM COT / 7:00 PM CET
    - cron: '0 21 * * *'  # 4:00 PM COT / 11:00 PM CET
    - cron: '0 1 * * *'   # 8:00 PM COT
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo: 'single' (Micro-doc 1 animal) o 'top' (Cuenta regresiva #3-#1)"
        required: false
        default: "single"
        type: choice
        options:
          - single
          - top
          - auto
      topic:
        description: "Tema o animal específico (ej. mantis_shrimp, orca_hunter, harpy_eagle o dejar vacío)"
        required: false
        default: ""

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Google Cloud Credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            mkdir -p credentials
            echo "$GCP_SERVICE_ACCOUNT_JSON" > credentials/gcp_service_account.json
            echo "Google Cloud Vertex AI credentials configured."
          fi

      - name: Run Wildlife Video Generator & Publisher
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_BACKUP: ${{ secrets.GROQ_API_KEY_BACKUP }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || secrets.WILDLIFE_FB_PAGE_ID || secrets.FACEBOOK_PAGE_ID || '1269051872959609' }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.WILDLIFE_FB_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FB_PAGE_ID || secrets.WILDLIFE_FB_PAGE_ID || secrets.FACEBOOK_PAGE_ID || '1269051872959609' }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.WILDLIFE_FB_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'single' }}"
          TOPIC="${{ github.event.inputs.topic || '' }}"
          
          CMD="python auto_pipeline.py --mode $MODE"
          if [ -n "$TOPIC" ]; then
            CMD="$CMD --topic \"$TOPIC\""
          fi
          
          echo "Executing: $CMD"
          eval $CMD

      - name: Commit and Push History State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(history): update wildlife published topics [skip ci]" && git push origin master)

      - name: Save Video Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-reels-output
          path: output/
          retention-days: 5
