name: Wild Vault - Wildlife Video Generator & Publisher

on:
  # Cronjob interno desactivado por solicitud del usuario (Se utiliza disparador externo vía API / Webhook)
  # schedule:
  #   - cron: '0 13 * * *'
  #   - cron: '0 17 * * *'
  #   - cron: '0 21 * * *'
  #   - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo: 'single' (Micro-doc 1 animal), 'top' (Cuenta regresiva #3-#1) o 'auto'"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - single
          - top
      topic:
        description: "Tema o animal específico (ej. mantis_shrimp, orca_hunter, harpy_eagle o dejar vacío)"
        required: false
        default: ""
  repository_dispatch:
    types: [trigger-wildlife-reels]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Google Cloud Credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            mkdir -p credentials
            echo "$GCP_SERVICE_ACCOUNT_JSON" > credentials/gcp_service_account.json
            echo "Google Cloud Vertex AI credentials configured."
          fi

      - name: Run Wildlife Video Generator & Publisher
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_BACKUP: ${{ secrets.GROQ_API_KEY_BACKUP }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY || 'AIzaSyDpdDhoXt8GDwJ_sEj-vjtd6HqVflN_vSY' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || secrets.WILDLIFE_FB_PAGE_ID || secrets.FACEBOOK_PAGE_ID || '1269051872959609' }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.WILDLIFE_FB_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FB_PAGE_ID || secrets.WILDLIFE_FB_PAGE_ID || secrets.FACEBOOK_PAGE_ID || '1269051872959609' }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.WILDLIFE_FB_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          INPUT_MODE="${{ github.event.inputs.mode || github.event.client_payload.mode || 'auto' }}"
          TOPIC="${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}"
          
          # Si el modo es 'auto', alternar entre single y top según la hora
          if [ "$INPUT_MODE" = "auto" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" -eq 17 ] || [ "$HOUR" -eq 1 ]; then
              FINAL_MODE="top"
            else
              FINAL_MODE="single"
            fi
          else
            FINAL_MODE="$INPUT_MODE"
          fi
          
          CMD="python auto_pipeline.py --mode $FINAL_MODE"
          if [ -n "$TOPIC" ]; then
            CMD="$CMD --topic \"$TOPIC\""
          fi
          
          echo "Ejecutando Modo: $FINAL_MODE | Comando: $CMD"
          eval $CMD

      - name: Commit and Push History State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "history.json" ]; then
            cp history.json /tmp/run_history.json
          fi
          git fetch origin master
          git checkout master || true
          git pull origin master --rebase || true
          if [ -f "/tmp/run_history.json" ]; then
            python -c "
import json
with open('/tmp/run_history.json', 'r', encoding='utf-8') as f:
    local_data = json.load(f)
try:
    with open('history.json', 'r', encoding='utf-8') as f:
        remote_data = json.load(f)
except Exception:
    remote_data = {'published_topics': [], 'used_video_urls': [], 'used_image_urls': []}

seen = set()
merged_topics = []
for t in remote_data.get('published_topics', []) + local_data.get('published_topics', []):
    key = (t.get('topic_id', ''), t.get('published_at', ''))
    if key not in seen:
        seen.add(key)
        merged_topics.append(t)

remote_data['published_topics'] = merged_topics
remote_data['total_published'] = len(merged_topics)
remote_data['used_video_urls'] = list(set(remote_data.get('used_video_urls', []) + local_data.get('used_video_urls', [])))
remote_data['used_image_urls'] = list(set(remote_data.get('used_image_urls', []) + local_data.get('used_image_urls', [])))
remote_data['last_updated'] = local_data.get('last_updated', '')

with open('history.json', 'w', encoding='utf-8') as f:
    json.dump(remote_data, f, indent=2, ensure_ascii=False)
"
            git add history.json
            git diff --staged --quiet || (git commit -m "chore(history): update wildlife published topics [skip ci]" && git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:master)
          fi

      - name: Save Video Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-reels-output
          path: output/
          retention-days: 5
