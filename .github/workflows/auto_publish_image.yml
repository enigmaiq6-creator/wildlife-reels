name: Wild Vault - Wildlife Image Generator & Publisher

on:
  schedule:
    # 6 Publicaciones estratégicas de imágenes al día (Distribución equilibrada a lo largo del día)
    - cron: '0 11 * * *'  # 6:00 AM COT / 7:00 AM EST (Pico Temprano)
    - cron: '0 14 * * *'  # 9:00 AM COT / 10:00 AM EST (Media Mañana)
    - cron: '0 18 * * *'  # 1:00 PM COT / 2:00 PM EST (Sobremesa / Tarde)
    - cron: '0 21 * * *'  # 4:00 PM COT / 5:00 PM EST (Regreso / Tarde)
    - cron: '0 0 * * *'   # 7:00 PM COT / 8:00 PM EST (Prime Time Noche)
    - cron: '0 3 * * *'   # 10:00 PM COT / 11:00 PM EST (Última hora de la noche)
  workflow_dispatch:
    inputs:
      format:
        description: "Formato de imagen (dejar vacío para selección aleatoria entre los 8 formatos)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - format_1_taxonomic_catalog
          - format_2_real_vs_illustrated
          - format_3_curiosity_pip
          - format_5_creature_profile
          - format_6_vintage_guide
          - format_7_breaking_news
          - format_8_quad_collage
  repository_dispatch:
    types: [trigger-wildlife-images]

permissions:
  contents: write

jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Google Cloud Credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            mkdir -p credentials
            echo "$GCP_SERVICE_ACCOUNT_JSON" > credentials/gcp_service_account.json
            echo "Google Cloud Vertex AI credentials configured."
          fi

      - name: Run Wildlife Image Generator & Publisher
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || secrets.WILDLIFE_FB_PAGE_ID || secrets.FACEBOOK_PAGE_ID || '1269051872959609' }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.WILDLIFE_FB_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FB_PAGE_ID || secrets.WILDLIFE_FB_PAGE_ID || secrets.FACEBOOK_PAGE_ID || '1269051872959609' }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.WILDLIFE_FB_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          FORMAT="${{ github.event.inputs.format || '' }}"
          CMD="python auto_image_pipeline.py"
          if [ -n "$FORMAT" ]; then
            CMD="$CMD --format \"$FORMAT\""
          fi
          echo "Ejecutando: $CMD"
          eval $CMD

      - name: Commit and Push History State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "history.json" ]; then
            cp history.json /tmp/run_history.json
          fi
          git fetch origin master
          git checkout master || true
          git pull origin master --rebase || true
          if [ -f "/tmp/run_history.json" ]; then
            python -c "
import json
with open('/tmp/run_history.json', 'r', encoding='utf-8') as f:
    local_data = json.load(f)
try:
    with open('history.json', 'r', encoding='utf-8') as f:
        remote_data = json.load(f)
except Exception:
    remote_data = {'published_topics': [], 'used_video_urls': [], 'used_image_urls': []}

seen = set()
merged_topics = []
for t in remote_data.get('published_topics', []) + local_data.get('published_topics', []):
    key = (t.get('topic_id', ''), t.get('published_at', ''))
    if key not in seen:
        seen.add(key)
        merged_topics.append(t)

remote_data['published_topics'] = merged_topics
remote_data['total_published'] = len(merged_topics)
remote_data['used_video_urls'] = list(set(remote_data.get('used_video_urls', []) + local_data.get('used_video_urls', [])))
remote_data['used_image_urls'] = list(set(remote_data.get('used_image_urls', []) + local_data.get('used_image_urls', [])))
remote_data['last_updated'] = local_data.get('last_updated', '')

with open('history.json', 'w', encoding='utf-8') as f:
    json.dump(remote_data, f, indent=2, ensure_ascii=False)
"
            git add history.json
            git diff --staged --quiet || (git commit -m "chore(history): update published image topics [skip ci]" && git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:master)
          fi

      - name: Save Image Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildvault-image-output
          path: output/images/
          retention-days: 5
